  image: "files/images/om.jpg"  # CHANGED (was "") — drives the link-preview image from YOUR domain
  description: "Software engineer & data analyst — Python, C++, SQL, CI/CD. 8+ years turning large-scale scientific data into reliable insights."  # CHANGED (was "")

  navbar:
    background: light  # You can change the background color here

    left:   # You can comment out all navigation items here if you just like to keep the index page only
#      - text: Home
#        href: index.qmd
      - text: About
        menu:
         # - text: News
         #   href: posts.qmd#category=news
         # - text: Events
