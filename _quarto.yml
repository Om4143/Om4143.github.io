        - text: Professional
          href: professional.qmd
      #    href: posts.qmd#category=presentation
      #- text: Group   # Comment the Group part out to remove the Group page
      #  href: people.qmd

    right:
      - text: CV
        href: files/Curriculum_Vitae_OSingh.pdf
      - icon: github
        href: https://github.com/Om4143
        target: _blank
      # CHANGED: Bluesky was a placeholder link to https://bsky.app (dead link).
      # Re-enable by uncommenting and adding YOUR handle, or leave commented to hide it.
      # - text: "{{< fa brands bluesky >}}"
      #   href: https://bsky.app/profile/YOUR-HANDLE
      #   target: _blank
      - icon: rss
        href: posts.xml
        target: _blank

  page-navigation: true

  page-footer:
    left: "[Omveer Singh](https://github.com/Om4143) &copy; <script>document.write(new Date().getFullYear())</script>"  # CHANGED (was a link to generic http://www.github.com)
    center: ""
    right:
      - icon: github
        href: https://github.com/Om4143
        target: _blank
      # CHANGED: Bluesky placeholder removed here too — re-add with your handle if you want it.
      # - text: "{{< fa brands bluesky >}}"
      #   href: https://bsky.app/profile/YOUR-HANDLE
      #   target: _blank
      - icon: rss
        href: posts.xml
        target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true

  draft-mode: unlinked

  repo-url: https://github.com/Om4143/Om4143.github.io  # CHANGED (was the template author's repo) — adjust if your site repo has a different name
#  repo-actions: [edit, issue, source]

  open-graph: true

  twitter-card: true
#  card-style: summary

  site-url: "https://om4143.github.io"  # CHANGED (was drganghe's template URL) — THIS is the key fix for link previews & canonical URLs

  google-analytics:
    tracking-id: ""  # Please delete or replace with your own tracking ID
    anonymize-ip: true

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/om4143\.github\.io\/custom'  # CHANGED (was drganghe's domain) — keeps your own links from being treated as external
    include-in-header: "files/includes/_academic.qmd"